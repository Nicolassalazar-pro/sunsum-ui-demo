  <head>
    <script>(function () {
  try {
    var stored = null;
    try {
      stored = window.localStorage.getItem("sunsum.theme");
    } catch (storageError) {
      stored = null;
    }
    var prefersLight =
      typeof window.matchMedia === "function" &&
      window.matchMedia("(prefers-color-scheme: light)").matches;
    var theme =
      stored === "light" || stored === "dark"
        ? stored
        : prefersLight
          ? "light"
          : "dark";
    document.documentElement.setAttribute("data-theme", theme);
  } catch (error) {}
})();</script>
